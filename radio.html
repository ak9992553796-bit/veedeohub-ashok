<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VeedeoHub - Bada Khajana</title>
<style>body{background:#0a1628;color:#f5e6a3;font-family:Arial;margin:0;text-align:center}.box{max-width:500px;margin:auto;padding:8px}.top{border:4px solid gold;background:#000;padding:10px;border-radius:12px;margin:6px}.btn{padding:10px;border-radius:8px;font-weight:800;margin:3px;border:2px solid gold;cursor:pointer}.btnGold{background:gold;color:#000}.btnBlack{background:#000;color:gold}.card{background:#fff;color:#000;border-radius:10px;margin:8px 0;padding:10px;text-align:left;border:2px solid gold}</style></head><body><div class="box">
<div class="top">
<h2 style="color:gold">📻 भजन खजाना बड़ा वाला जी</h2>
<div style="border:2px solid gold;border-radius:10px;overflow:hidden;background:#000">
<iframe id="ytPlayer" width="100%" height="260" src="https://www.youtube.com/embed/AETFvQonf08?rel=0" frameborder="0" allowfullscreen></iframe>
</div>
<p id="nowPlaying" style="color:gold;font-weight:900">हनुमान चालीसा बज रहा है जी</p>
<button onclick="prevPlay()" class="btn btnBlack">⏮️ पिछला</button>
<button onclick="stopPlayer()" class="btn btnGold">⏹️ बंद</button>
<button onclick="nextPlay()" class="btn btnBlack">⏭️ अगला</button>
</div>
<div id="list"></div>
</div>
<script>
let curIdx=0;
let DATA=[
{id:"AETFvQonf08", t:"1. हनुमान चालीसा जी - गुलशन कुमार"},
{id:"B--9h2oFq5k", t:"2. हनुमान आरती जी"},
{id:"OPf0YbXqDm0", t:"3. गणेश आरती जी - जय गणेश देवा"},
{id:"RgKAFK5djSk", t:"4. लक्ष्मी आरती जी"},
{id:"_6XnK5G6RRE", t:"5. शिव आरती जी - ओम जय शिव ओमकारा"},
{id:"abL9N6dA6_o", t:"6. गायत्री मंत्र 108 बार जी"},
{id:"9ct1a7GylHs", t:"7. शिव तांडव स्तोत्र जी"}
];
function renderList(){
 let box=document.getElementById('list'); box.innerHTML='';
 DATA.forEach((a,i)=>{
  box.innerHTML+=`<div class="card"><div style="font-weight:900">${a.t}</div><button class="btn btnGold" style="width:100%;margin-top:6px" onclick="playYT(${i})">▶️ बजाओ जी</button></div>`;
 });
}
function playYT(i){ curIdx=i; let v=DATA[i]; document.getElementById('ytPlayer').src="https://www.youtube.com/embed/"+v.id+"?autoplay=1&rel=0"; document.getElementById('nowPlaying').innerText="बज रहा है जी: "+v.t; }
function stopPlayer(){ document.getElementById('ytPlayer').src=""; document.getElementById('nowPlaying').innerText="बंद है जी"; }
function nextPlay(){ curIdx=(curIdx+1)%DATA.length; playYT(curIdx); }
function prevPlay(){ curIdx=(curIdx-1+DATA.length)%DATA.length; playYT(curIdx); }
renderList();
</script>
</body></html>
