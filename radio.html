<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Radio FINAL - nCKdihvneS0 Wala</title>
<style>body{background:#0a1628;color:#f5e6a3;font-family:Arial;margin:0;text-align:center}.box{max-width:480px;margin:auto;padding:8px}.top{border:4px solid gold;background:#000;padding:10px;border-radius:12px;margin:6px}.btn{padding:10px;border-radius:8px;font-weight:800;margin:3px;border:2px solid gold;cursor:pointer}.btnGold{background:gold;color:#000}.btnBlack{background:#000;color:gold}.card{background:#fff;color:#000;border-radius:10px;margin:8px 0;padding:8px;text-align:left;border:2px solid gold}.search{width:90%;padding:12px;border:3px solid gold;border-radius:10px;font-weight:700;font-size:16px}</style></head><body><div class="box">
<div class="top">
<h3 style="color:gold">📻 गाने वाला खजाना जी - आपका वाला</h3>
<p style="color:#0f0;font-size:11px">आपका भजन nCKdihvneS0 लगा दिया जी</p>
<div style="background:#000;border:2px solid gold;border-radius:10px;overflow:hidden">
<iframe id="ytPlayer" width="100%" height="240" src="https://www.youtube.com/embed/nCKdihvneS0?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>
<p id="nowPlaying" style="color:gold;font-weight:900;margin:8px">आपका भजन तैयार है जी - nCKdihvneS0</p>
<button onclick="stopPlayer()" class="btn btnGold" style="width:90%">⏹️ बंद करो जी</button><br>
<button onclick="prevPlay()" class="btn btnBlack">⏮️ पिछला जी</button>
<button onclick="nextPlay()" class="btn btnBlack">⏭️ अगला जी</button>
<div style="margin-top:8px">
<input id="aSearch" class="search" placeholder="Arti Hanuman Shiv लिखो जी" oninput="renderList()">
</div>
<div style="margin-top:6px">
<button class="btn btnBlack" onclick="setCat('All')">सभी जी</button>
<button class="btn btnBlack" onclick="setCat('Aarti')">आरती जी</button>
<button class="btn btnBlack" onclick="setCat('Chalisa')">चालीसा जी</button>
<button class="btn btnBlack" onclick="setCat('Bhajan')">भजन जी</button>
</div>
</div>
<div id="list"></div>
</div>
<script>
let curCat='All'; let curIdx=0;
let DATA=[
{id:"nCKdihvneS0", t:"आपका भेजा भजन - nCKdihvneS0 - गाने वाला", c:"Bhajan", k:"aapka bhajan nckdihvnes0 arti hanuman"},
{id:"AETFvQonf08", t:"Hanuman Chalisa Gulshan Kumar", c:"Chalisa", k:"hanuman chalisa"},
{id:"B--9h2oFq5k", t:"Hanuman Aarti Aarti Kije", c:"Aarti", k:"hanuman aarti arti"},
{id:"OPf0YbXqDm0", t:"Ganesh Aarti Jai Ganesh Deva", c:"Aarti", k:"ganesh aarti arti"},
{id:"RgKAFK5djSk", t:"Lakshmi Aarti Om Jai Lakshmi Mata", c:"Aarti", k:"lakshmi aarti arti"},
{id:"nCKdihvneS0", t:"Shiv Aarti Om Jai Shiv Omkara - आपका वाला", c:"Aarti", k:"shiv aarti arti"},
{id:"nCKdihvneS0", t:"Gayatri Mantra 108 Times - आपका वाला", c:"Bhajan", k:"gayatri mantra"},
{id:"AETFvQonf08", t:"Shiv Tandav Stotram", c:"Bhajan", k:"shiv tandav"}
];
function setCat(c){curCat=c; renderList();}
function renderList(){
 let q=document.getElementById('aSearch').value.toLowerCase().trim();
 let box=document.getElementById('list'); box.innerHTML='';
 let words=q.split(" ").filter(w=>w);
 let cnt=0;
 DATA.forEach((a,i)=>{
  if(curCat!='All' && a.c!=curCat) return;
  let all=(a.t+" "+a.c+" "+a.k).toLowerCase();
  let ok=true; for(let w of words){ if(all.indexOf(w)==-1){ ok=false; break; } }
  if(q &&!ok) return;
  cnt++;
  box.innerHTML+=`<div class="card"><div style="font-weight:900">${a.t}</div><div style="font-size:11px">${a.c} जी</div><button class="btn btnGold" onclick="playYT(${i})">▶️ बजाओ जी</button></div>`;
 });
 if(cnt==0 && q==""){ DATA.forEach((a,i)=>{ if(curCat!='All' && a.c!=curCat) return; box.innerHTML+=`<div class="card"><div style="font-weight:900">${a.t}</div><div style="font-size:11px">${a.c} जी</div><button class="btn btnGold" onclick="playYT(${i})">▶️ बजाओ जी</button></div>`; }); }
}
function playYT(i){
 curIdx=i;
 let v=DATA[i];
 document.getElementById('ytPlayer').src="https://www.youtube.com/embed/"+v.id+"?autoplay=1&rel=0";
 document.getElementById('nowPlaying').innerText="बज रहा है जी: "+v.t;
}
function stopPlayer(){ document.getElementById('ytPlayer').src="https://www.youtube.com/embed/nCKdihvneS0?rel=0"; document.getElementById('nowPlaying').innerText="बंद है जी"; }
function nextPlay(){ curIdx=(curIdx+1)%DATA.length; playYT(curIdx); }
function prevPlay(){ curIdx=(curIdx-1+DATA.length)%DATA.length; playYT(curIdx); }
renderList();
</script>
</body></html>
