<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anant Radio - Full Video Library</title>
<style>
body{margin:0;background:#070e1f;color:#fff;font-family:system-ui}
.header{background:#000;border-bottom:3px solid gold;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:gold;font-weight:bold;font-size:18px}
.main{max-width:560px;margin:auto;padding:6px}
.nowbox{background:#000;border:2px solid gold;border-radius:12px;padding:10px;margin:8px 0}
.btn{width:100%;padding:14px;border-radius:12px;border:2px solid gold;background:linear-gradient(#222,#000);color:gold;font-size:17px;font-weight:bold;margin:5px 0}
.btn-play{background:gold;color:#000}
.controls{display:flex;gap:6px}
.controls button{flex:1;padding:12px;border-radius:10px;border:2px solid gold;background:#000;color:gold;font-weight:bold}
.card{background:#fff;color:#000;border-radius:14px;padding:10px;margin:10px 0;border:3px solid gold}
.row{display:flex;gap:10px;padding:10px;border-bottom:1px solid #eee;align-items:center}
.row img{width:72px;height:48px;border-radius:8px;object-fit:cover;border:2px solid gold;background:#000}
.row.txt{flex:1}
.row.txt b{font-size:14px;display:block}
.row.txt span{font-size:11px;color:#666}
.mic{width:38px;height:38px;border-radius:50%;border:2px solid gold;background:#000;color:gold;font-size:18px}
.mic.playing{background:gold;color:#000;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
iframe{width:100%;height:240px;border-radius:12px;border:3px solid gold;margin-top:8px;background:#000}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.filter label{background:#222;border:1px solid gold;border-radius:20px;padding:5px 10px;font-size:12px;color:gold}
</style></head><body>
<div class="header"><div class="logo">📻 Anant Radio - All Life</div><div>🔔 ⚙️</div></div>
<div class="main">
<div class="nowbox">
<div id="now" style="color:#0f0;font-weight:bold">रेडी जी... सारा ऑटो चलाओ जी दबाओ जी</div>
<div id="playerArea"></div>
<div style="margin-top:8px;display:flex;gap:6px">
<button class="btn btn-play" onclick="startAuto()">▶️ सारा ऑटो चलाओ जी - All Life</button>
</div>
<div class="controls"><button onclick="stopAll()">⏹️ बंद</button><button onclick="nextPlay()">⏭️ अगला</button><button onclick="speakNow()">🎤 बोलो जी</button></div>
<div class="filter">
<label><input type="checkbox" id="f1" checked onchange="render()"> आरती</label>
<label><input type="checkbox" id="f2" checked onchange="render()"> जड़ी-बूटी</label>
<label><input type="checkbox" id="f3" checked onchange="render()"> सुविचार</label>
<label><input type="checkbox" id="f4" checked onchange="render()"> कथा</label>
<label><input type="checkbox" id="f5" checked onchange="render()"> कॉमेडी</label>
<label><input type="checkbox" id="f6" checked onchange="render()"> TV</label>
</div>
</div>
<div class="card"><b>🎬 Content Library - फ्री वाली लाइब्रेरी जी - बारी-बारी बजेगी जी</b><div id="list"></div></div>
</div>
<script>
const LIB=[
{id:"c1", cat:"आरती भजन", title:"ॐ जय जगदीश हरे - पूरी आरती 8 अंतरा", desc:"भक्तजनों के संकट क्षण में दूर करे - पूरी आरती जी", thumb:"https://img.youtube.com/vi/6K2q7M3e4Qc/0.jpg", yt:"https://www.youtube.com/embed/a18py61_Fl8", full:"ॐ जय जगदीश हरे स्वामी जय जगदीश हरे। भक्तजनों के संकट क्षण में दूर करे। जो ध्यावे फल पावे दुख बिनसे मन का। सुख संपत्ति घर आवे कष्ट मिटे तन का। मात पिता तुम मेरे शरण गहूं मैं किसकी। तुम बिन और न दूजा आस करूं मैं जिसकी। तुम पूरण परमात्मा तुम अंतर्यामी। पारब्रह्म परमेश्वर तुम सबके स्वामी। तुम करुणा के सागर तुम पालनकर्ता। मैं सेवक तुम स्वामी कृपा करो भर्ता।"},
{id:"c1", cat:"आरती भजन", title:"जय माता दी - पहाड़ों वाली माता आरती", desc:"ऊँचे पर्वत भवन निराला - पूरी आरती जी", thumb:"https://img.youtube.com/vi/Jb0v1pBv0dE/0.jpg", yt:"https://www.youtube.com/embed/4bP2a1h9c0d", full:"जय माता दी जय माता दी पहाड़ों वाली माता तेरी सदा ही जय। ऊँचे पर्वत भवन निराला ज्योति जगे मतवाली। तेरी महिमा सबसे न्यारी दुनिया शीश झुकाती। तेरे दर पे जो भी आया खाली हाथ न लौटा।"},
{id:"c1", cat:"आरती भजन", title:"हनुमान आरती - आरती कीजै हनुमान लला की", desc:"दुष्ट दलन रघुनाथ कला की - पूरी आरती जी", thumb:"https://img.youtube.com/vi/7A5b6c9d2e1/0.jpg", yt:"https://www.youtube.com/embed/_3P4o1x7f2s", full:"आरती कीजै हनुमान लला की। दुष्ट दलन रघुनाथ कला की। जाके बल से गिरिवर कांपे। रोग दोष जाके निकट न झांके। अंजनि पुत्र महा बलदाई। संतन के प्रभु सदा सहाई।"},
{id:"c2", cat:"आयुर्वेद", title:"तुलसी के 10 चमत्कारी लाभ - घर की डॉक्टर", desc:"सर्दी खांसी इम्यूनिटी के लिए अमृत जी", thumb:"https://img.youtube.com/vi/9z8y7x6w5v4/0.jpg", yt:"https://www.youtube.com/embed/8uJ8p7f9g0h", full:"तुलसी के लाभ जी। तुलसी सर्दी खांसी में अमृत है जी। रोज सुबह 5 पत्ते तुलसी के खाने से इम्यूनिटी बढ़ती है। सर्दी जुकाम बुखार में तुलसी काढ़ा पीओ जी।"},
{id:"c2", cat:"आयुर्वेद", title:"अश्वगंधा - ताकत और नींद का वरदान", desc:"तनाव अनिद्रा के लिए उत्तम जी", thumb:"https://img.youtube.com/vi/1a2s3d4f5g6/0.jpg", yt:"https://www.youtube.com/embed/2b3c4d5e6f7", full:"अश्वगंधा के लाभ जी। ताकत और नींद के लिए उत्तम है जी। जिनको नींद नहीं आती तनाव रहता है वो रात को दूध के साथ अश्वगंधा पाउडर लें जी।"},
{id:"c3", cat:"सुविचार", title:"चाणक्य नीति - जीवन बदलने वाले 5 विचार", desc:"मीठा बोलो सच बोलो जी", thumb:"https://img.youtube.com/vi/3c4v5b6n7m8/0.jpg", yt:"https://www.youtube.com/embed/3c4v5b6n7m8", full:"चाणक्य नीति जी। मीठा बोलो सच बोलो सबके दिल में बस जाओ जी। कभी भी अपना राज किसी को मत बताओ जी।"},
{id:"c4", cat:"कथा", title:"रामायण कथा - श्री राम वनवास और मर्यादा", desc:"14 साल वनवास की पूरी कथा जी", thumb:"https://img.youtube.com/vi/4d5f6g7h8j9/0.jpg", yt:"https://www.youtube.com/embed/4d5f6g7h8j9", full:"रामायण कथा जी। श्री राम ने मर्यादा का पालन किया जी। 14 साल वनवास किया जी। रावण का वध करके सीता माता को वापस लाए जी।"},
{id:"c5", cat:"कॉमेडी", title:"रोज नया चुटकला - हँसी का खजाना", desc:"हँसोगे तो दिल खुश रहेगा जी", thumb:"https://img.youtube.com/vi/5e6f7g8h9i0/0.jpg", yt:"https://www.youtube.com/embed/5e6f7g8h9i0", full:"कॉमेडी जी। हँसोगे तो दिल खुश रहेगा जी। टेंशन दूर होगा जी। एक आदमी डॉक्टर के पास गया बोला डॉक्टर साहब मुझे सब भूल जाता है। डॉक्टर बोला कब से। आदमी बोला कब से क्या जी। हाहाहा।"}
];
let queue=[];let cur=0;let auto=false;let currentFull="";
function getFilters(){let f=[]; if(document.getElementById('f1').checked) f.push('c1'); if(document.getElementById('f2').checked) f.push('c2'); if(document.getElementById('f3').checked) f.push('c3'); if(document.getElementById('f4').checked) f.push('c4'); if(document.getElementById('f5').checked) f.push('c5'); if(document.getElementById('f6').checked) f.push('c6'); return f;}
function render(){let filters=getFilters(); let filtered=LIB.filter(x=>filters.includes(x.id)); if(document.getElementById('f6').checked) filtered=LIB; let html=""; filtered.forEach((item,i)=>{html+=`<div class="row"><img src="${item.thumb}" onerror="this.src='https://via.placeholder.com/72x48?text=Video'"><div class="txt"><b>${i+1}. ${item.title}</b><span>${item.cat} • ${item.desc}</span></div><button class="mic" id="mic-${i}" onclick="playItem(${LIB.indexOf(item)})">🎤</button><button class="mic" onclick="playVideo(${LIB.indexOf(item)})">▶️</button></div>`;}); document.getElementById('list').innerHTML=html; queue=filtered; cur=0;}
function playItem(i){let item=LIB[i]; currentFull=item.full; document.getElementById('now').innerText="🔊 अब बज रहा है जी: "+item.title; document.getElementById('playerArea').innerHTML='<iframe src="'+item.yt+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe><div style="color:#ff0;font-size:12px;margin-top:6px">'+item.full.substring(0,200)+'... पूरा माइक बोलेगा जी</div>'; document.querySelectorAll('.mic').forEach(m=>m.classList.remove('playing')); let mic=document.getElementById('mic-'+queue.indexOf(item)); if(mic) mic.classList.add('playing'); speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(item.full); u.lang='hi-IN'; u.rate=0.85; u.onend=()=>{if(auto) nextPlay();}; speechSynthesis.speak(u);}
function playVideo(i){playItem(i);}
function speakNow(){if(currentFull){speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(currentFull); u.lang='hi-IN'; u.rate=0.85; speechSynthesis.speak(u);} }
function startAuto(){auto=true;render(); if(queue.length>0){let realIdx=LIB.indexOf(queue[0]); playItem(realIdx);} }
function nextPlay(){cur++; if(cur>=queue.length) cur=0; let realIdx=LIB.indexOf(queue[cur]); playItem(realIdx);}
function stopAll(){auto=false;speechSynthesis.cancel();document.getElementById('playerArea').innerHTML="";document.getElementById('now').innerText="बंद कर दिया जी";document.querySelectorAll('.mic').forEach(m=>m.classList.remove('playing'));}
render();
</script>
</body></html><a href="radio.html" style="display:block;background:gold;color:#000;padding:15px;border-radius:12px;text-align:center;font-weight:bold;font-size:18px;margin:10px;text-decoration:none;border:3px solid #000">📻 अनन्त रेडियो सुनो जी - फ्री लाइब्रेरी - बटन दबाओ जी - All Life</a>
