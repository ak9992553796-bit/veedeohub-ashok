<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anant Radio - All Life</title>
<style>
body{margin:0;background:#070e1f;color:#fff;font-family:system-ui;padding:6px}
.header{background:#000;border-bottom:3px solid gold;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{color:gold;font-weight:bold}
.card{background:#111;border:2px solid gold;border-radius:14px;padding:10px;margin:10px 0}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
.btn{padding:13px;border-radius:12px;border:2px solid gold;font-weight:bold}
.btn-gold{width:100%;background:gold;color:#000;font-size:17px}
.btn-row{display:flex;gap:6px;margin:8px 0}
.btn-dark{flex:1;background:#000;color:gold}
.badge{background:#222;border:1px solid gold;color:gold;padding:6px 10px;border-radius:20px;font-size:12px}
.row{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222}
.row img{width:80px;height:54px;border-radius:8px;object-fit:cover;border:2px solid gold}
</style></head><body>
<div class="header"><div class="logo">📻 Anant Radio - All Life</div><div>🔔 ⚙️</div></div>
<div class="card">
<div id="now" style="color:#0f0;font-weight:bold">रेडी जी...</div>
<div class="player"><iframe id="yt" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
<div id="desc" style="font-size:12px;color:#ff0;margin-top:6px"></div>
<button class="btn btn-gold" onclick="playAll()">▶️ सारा ऑटो चलाओ जी - All Life</button>
<div class="btn-row"><button class="btn btn-dark" onclick="stop()">⏹️ बंद</button><button class="btn btn-dark" onclick="next()">⏭️ अगला</button><button class="btn btn-dark" onclick="alert('बोलो जी')">🎤 बोलो जी</button></div>
<div id="cats" style="display:flex;gap:6px;flex-wrap:wrap"></div>
</div>
<div class="card"><b>🎬 Content Library - फ्री लाइब्रेरी जी</b><div id="list"></div></div>
<script>
const lib=[
{id:"QW2gMEmW7A4",t:"ॐ जय जगदीश हरे - 8 अंतरा पूरी आरती",d:"भक्तजनों के संकट क्षण में दूर करे",c:"आरती"},
{id:"g2DO6n1m2rE",t:"हनुमान आरती",d:"दुष्ट दलन रघुनाथ कला की",c:"आरती"},
{id:"m3A9aKqFv8M",t:"गायत्री मंत्र 108 बार",d:"ॐ भूर्भुवः स्वः",c:"आरती"},
{id:"6R8bK4s5s8U",t:"तुलसी के लाभ",d:"सर्दी खांसी इम्यूनिटी अमृत जी",c:"जड़ी-बूटी"},
{id:"u8XkLqYJ7nM",t:"चाणक्य नीति",d:"मीठा बोलो सच बोलो जी",c:"सुविचार"},
{id:"3a5b7c9d1e2",t:"रामायण कथा",d:"14 साल वनवास की कथा जी",c:"कथा"},
{id:"f4g6h8j0k1l",t:"रोज नया चुटकला",d:"हँसोगे तो दिल खुश रहेगा जी",c:"कॉमेडी"},
{id:"kJQP7kiw5Fk",t:"Veedeohub TV",d:"आपका TV जी",c:"TV"}
];
let cur=0;
function load(i){cur=i;let v=lib[i];document.getElementById('now').innerText='🔊 अब बज रहा है जी: '+v.t;document.getElementById('desc').innerText=v.d+' जी';document.getElementById('yt').src='https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&rel=0';render();}
function next(){load((cur+1)%lib.length)}function playAll(){load(0)}function stop(){document.getElementById('yt').src='';document.getElementById('now').innerText='बंद कर दिया जी'}
function render(){let cats=[...new Set(lib.map(x=>x.c))];document.getElementById('cats').innerHTML=cats.map(c=>'<span class=badge onclick="load('+lib.findIndex(x=>x.c==c)+')">☑️ '+c+'</span>').join('');document.getElementById('list').innerHTML=lib.map((v,i)=>'<div class=row onclick="load('+i+')"><img src="https://img.youtube.com/vi/'+v.id+'/mqdefault.jpg"><div><b style="font-size:14px">'+v.t+'</b><div style="font-size:11px;color:#aaa">'+v.c+' • '+v.d+'</div></div></div>').join('');}
window.onload=()=>{render();load(0);};
</script></body></html>
