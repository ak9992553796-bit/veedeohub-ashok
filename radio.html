<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Radio Final - Sahi Bhajan Only</title>
<style>body{background:#0a1628;color:#f5e6a3;font-family:Arial;margin:0;text-align:center}.box{max-width:500px;margin:auto;padding:8px}.top{border:4px solid gold;background:#000;padding:10px;border-radius:12px}.btn{padding:10px;border-radius:8px;font-weight:800;margin:3px;border:2px solid gold;cursor:pointer}.btnGold{background:gold;color:#000}.btnBlack{background:#000;color:gold}.card{background:#fff;color:#000;border-radius:10px;margin:8px 0;padding:10px;text-align:left;border:2px solid gold}</style>
</head><body><div class="box"><div class="top">
<h2 style="color:gold">📻 भजन खजाना - FINAL जी</h2>
<div style="border:2px solid gold;border-radius:10px;overflow:hidden;background:#000"><iframe id="ytPlayer" width="100%" height="260" src="about:blank" frameborder="0" allowfullscreen></iframe></div>
<p id="nowPlaying" style="color:gold;font-weight:900">बंद है जी</p>
<button onclick="prevPlay()" class="btn btnBlack">⏮️ पिछला</button>
<button onclick="stopPlayer()" class="btn btnGold">⏹️ बंद</button>
<button onclick="nextPlay()" class="btn btnBlack">⏭️ अगला</button>
<a href="arti.html" style="display:block;background:#111;color:gold;border:2px solid gold;padding:10px;border-radius:10px;margin:8px 0;text-decoration:none;font-weight:800">🪔 आरती वाली पर जाओ जी</a>
</div>
<div id="list"></div>

<!-- पैसे आने वाला सही QR जी - आपका वाला -->
<div style="text-align:center;border:3px solid gold;padding:12px;border-radius:12px;background:#000;margin-top:12px">
<div style="color:gold;font-weight:900">🙏 सहयोग के लिए - सही QR जी</div>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9992553796@ybl%26pn=Ashok%20Kumar%26cu=INR" style="background:#fff;padding:6px;border-radius:8px;border:3px solid gold;margin:8px 0">
<div><a href="upi://pay?pa=9992553796@ybl&pn=Ashok%20Kumar&cu=INR" style="background:gold;color:#000;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:800;display:inline-block">💛 UPI सहयोग जी</a></div>
<div style="font-size:10px;color:#aaa">आप खुद स्कैन मत करो जी - दूसरों के लिए है जी</div>
</div>
</div>
<script>
let curIdx=0;
let DEFAULT_DATA=[
{id:"AETFvQonf08",t:"1. हनुमान चालीसा जी"},
{id:"B--9h2oFq5k",t:"2. हनुमान आरती जी"},
{id:"O4M5a4Uej1Q",t:"3. गणेश आरती जी"},
{id:"l2w3AdT5l1I",t:"4. शिव आरती जी"},
{id:"_6XnK5G6RRE",t:"5. गायत्री मंत्र जी"},
{id:"9ct1a7GylHs",t:"6. शिव तांडव जी"},
{id:"o1Qd9Jv1h4o",t:"7. लक्ष्मी आरती जी"}
];
function getData(){return DEFAULT_DATA}
function renderList(){let b=document.getElementById('list');b.innerHTML='';getData().forEach((a,i)=>{b.innerHTML+=`<div class="card"><b>${a.t}</b><button class="btn btnGold" style="width:100%;margin-top:6px" onclick="playYT(${i})">▶️ बजाओ जी</button></div>`})}
function playYT(i){curIdx=i;let v=getData()[i];document.getElementById('ytPlayer').src="https://www.youtube.com/embed/"+v.id+"?autoplay=1";document.getElementById('nowPlaying').innerText="बज रहा: "+v.t}
function stopPlayer(){document.getElementById('ytPlayer').src="about:blank";document.getElementById('nowPlaying').innerText="बंद है जी"}
function nextPlay(){curIdx=(curIdx+1)%getData().length;playYT(curIdx)}function prevPlay(){curIdx=(curIdx-1+getData().length)%getData().length;playYT(curIdx)}
renderList();
</script></body></html>
