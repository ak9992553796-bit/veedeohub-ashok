<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>💾 Saved - FB जैसा जी</title>
<style>
body{margin:0;background:#070a1a;color:#fff;font-family:system-ui;padding:10px}
.top{background:#000;border-bottom:3px solid gold;padding:12px;text-align:center;position:sticky;top:0}
.card{background:#121528;border:2px solid gold;border-radius:16px;padding:14px;margin:12px 0;display:flex;gap:10px;align-items:center}
.btn{padding:10px 14px;background:gold;color:#000;border-radius:10px;font-weight:bold;text-decoration:none;display:inline-block;margin:5px}
</style></head><body>
<div class="top">
<div style="color:gold;font-weight:bold;font-size:18px">💾 आपका सेव किया हुआ खजाना - FB जैसा जी</div>
<a class="btn" href="aarti.html">🔙 aarti.html पर वापस</a>
<a class="btn" href="index.html" style="background:#000;color:gold;border:2px solid gold">🏠 मुख्य पेज</a>
</div>

<div id="savedBox" style="margin-top:10px"></div>

<script src="khazana.js"></script>
<script>
// aarti.html वाला पूरा लिब
var BHAG_1_AARTI=[{t:"ॐ जय जगदीश हरे",c:"आरती",icon:"🪔"},{t:"जय गणेश देवा",c:"आरती",icon:"🪔"},{t:"लक्ष्मी आरती",c:"आरती",icon:"🪔"},{t:"दुर्गा आरती",c:"आरती",icon:"🪔"},{t:"शिव आरती",c:"आरती",icon:"🪔"}];
var BHAG_2_BHAJAN=[{t:"गायत्री मंत्र",c:"भजन",icon:"🕉️"},{t:"तुलसी फायदे",c:"जड़ी-बूटी",icon:"🌿"}];
var BHAG_3_CHALISA=[{t:"हनुमान चालीसा",c:"चालीसा",icon:"🙏"},{t:"शिव चालीसा",c:"चालीसा",icon:"🙏"}];
var BHAG_4_TANDAV=[{t:"शिव तांडव",c:"तांडव",icon:"🔱"}];
var BHAG_5_KABIR_GRANTH=[{t:"कबीर दोहे",c:"कबीर",icon:"📜"},{t:"रामायण कथा",c:"कथा",icon:"📖"},{t:"सुविचार",c:"सुविचार",icon:"💡"},{t:"चुटकला",c:"कॉमेडी",icon:"😂"}];
var lib=[...BHAG_1_AARTI,...BHAG_2_BHAJAN,...BHAG_3_CHALISA,...BHAG_4_TANDAV,...BHAG_5_KABIR_GRANTH];

let saved=JSON.parse(localStorage.getItem("VEED_SAVED")||"[]");
let box=document.getElementById("savedBox");

if(saved.length==0){
 box.innerHTML=`<div class="card" style="justify-content:center">जी अभी कुछ सेव नहीं किया जी - aarti.html में जाकर 💾 सेव दबाओ जी</div>`;
}else{
 box.innerHTML=saved.map(i=>{
  let v=lib[i]; if(!v) return "";
  return `<div class="card"><div style="font-size:32px">${v.icon}</div><div style="flex:1"><b>${v.t}</b><div style="font-size:12px;color:#aaa">${v.c}</div></div><div style="color:gold">✅</div></div>`;
 }).join('');
}
</script></body></html>
