];

var lib = [...BHAG_1_AARTI,...BHAG_2_BHAJAN,...BHAG_3_CHALISA,...BHAG_4_TANDAV,...BHAG_5_KABIR_GRANTH];
var DATA = lib; // जी FB लोडर के लिए जी

// ======= FB वाला सेव / अनसेव सिस्टम जी =======
function saveKaro(id){
 let saved = JSON.parse(localStorage.getItem("VEED_SAVED")||"[]");
 if(saved.includes(id)){ saved = saved.filter(x=>x!=id); }
 else{ saved.push(id); }
 localStorage.setItem("VEED_SAVED", JSON.stringify(saved));
 render();
}
function isSaved(id){ let s=JSON.parse(localStorage.getItem("VEED_SAVED")||"[]"); return s.includes(id); }

// ======= प्लेयर सिस्टम जी =======
let cur=0,loop=true,hindi=true;let synth=window.speechSynthesis;
function getVoice(){let v=synth.getVoices();let hv=v.find(x=>x.lang.includes('hi'));return hv||v[0];}
function speak(t){synth.cancel();let u=new SpeechSynthesisUtterance(t);u.voice=getVoice();u.lang='hi-IN';u.rate=0.9;u.onstart=()=>{document.getElementById('status').innerText="🔊 बज रहा है जी...";document.getElementById('icon').innerText="🔊";};u.onend=()=>{document.getElementById('status').innerText="पूरा हुआ जी";document.getElementById('icon').innerText="✅";if(loop)setTimeout(()=>next(),1500);};synth.speak(u);}
function load(i){cur=i;let v=lib[i];document.getElementById('now').innerText="🔊 अब बज रहा है जी: "+v.t;document.getElementById('lyrics').innerText=v.txt;document.getElementById('icon').innerText=v.icon;render();speak(v.txt);}
function next(){load((cur+1)%lib.length)}function playAll(){load(0)}function stop(){synth.cancel();document.getElementById('status').innerText="बंद कर दिया जी";document.getElementById('icon').innerText="⏹️";}
function toggleLoop(){loop=!loop;document.getElementById('loopBtn').innerText=loop?"🔁 लूप: चालू":"🔁 लूप: बंद";}
function filterCat(c){let idx=lib.findIndex(x=>x.c==c);if(idx>=0)load(idx);}

function render(filter=""){
 let cats=[...new Set(lib.map(x=>x.c))];
 document.getElementById('cats').innerHTML=cats.map(c=>`<span class="badge ${lib[cur].c==c?'active':''}" onclick="filterCat('${c}')">☑️ ${c}</span>`).join('');
 let f=filter.toLowerCase();
 let filtered = lib.map((v,i)=>({v,i})).filter(o=> o.v.t.toLowerCase().includes(f) || o.v.c.toLowerCase().includes(f) || o.v.type.includes(f));
 document.getElementById('list').innerHTML=filtered.map(o=>`<div class="list-item" style="${o.i==cur?'background:#1e2140;border:1px solid gold':''}"><div style="font-size:32px" onclick="load(${o.i})">${o.v.icon}</div><div style="flex:1" onclick="load(${o.i})"><b style="font-size:14px">${o.v.t}</b><div style="font-size:11px;color:#aaa">${o.v.c} • ${o.v.type}</div></div><div><button onclick="saveKaro(${o.i})" style="background:${isSaved(o.i)?'gold':'#000'};color:${isSaved(o.i)?'#000':'gold'};border:1px solid gold;border-radius:8px;padding:6px 8px">${isSaved(o.i)?'✅ सेव':'💾 सेव'}</button></div></div>`).join('');
}

document.getElementById('searchAarti').addEventListener("input", e=> render(e.target.value));
window.onload=()=>{setTimeout(()=>{synth.getVoices();render();},500);};
