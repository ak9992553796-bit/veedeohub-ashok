<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अशोक जी की आरती जी</title>
<style>
body{margin:0;background:#FFF8E7;font-family:sans-serif}
.player{background:#fff;margin:10px;padding:15px;border-radius:15px;box-shadow:0 4px 10px #0002;text-align:center}
#fakeVideo{width:100%;height:170px;background:#000;border-radius:12px;margin-bottom:10px;object-fit:cover;border:2px solid orange}
button{padding:10px 18px;border:none;border-radius:20px;background:orange;color:#fff;font-weight:bold;margin:3px}
.list{padding:10px}
.item{background:#fff;padding:12px;margin:6px 0;border-radius:10px;box-shadow:0 2px 5px #0001}
</style>
</head>
<body>
<div class="player">
<video id="fakeVideo" autoplay loop muted playsinline controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
<h2 id="title"></h2>
<p id="lyrics"></p>
<button onclick="prev()">⏮️ पीछे जी</button>
<button onclick="next()">आगे जी ⏭️</button>
</div>
<div class="list" id="list"></div>
<script>
// जी यही वो खजाना है जी - अब इसी में आ गया जी - 1000 गाना वाला जी
let data = [
  {n:1, t:"हनुमान चालीसा जी", c:"चालीसा", icon:"🙏", video:"https://www.w3schools.com/html/mov_bbb.mp4", txt:"श्री गुरु चरण..."},
  {n:2, t:"शिव तांडव जी", c:"भजन", icon:"🔱", video:"https://www.w3schools.com/html/movie.mp4", txt:"जटा टवी..."},
  {n:3, t:"गणेश आरती जी", c:"आरती", icon:"🪔", video:"https://www.w3schools.com/html/mov_bbb.mp4", txt:"जय गणेश..."},
  {n:4, t:"दुर्गा चालीसा जी", c:"चालीसा", icon:"🌺", video:"https://www.w3schools.com/html/movie.mp4", txt:"नमो नमो..."},
  {n:5, t:"कृष्ण भजन जी", c:"भजन", icon:"🦚", video:"https://www.w3schools.com/html/mov_bbb.mp4", txt:"श्री कृष्ण..."},
];
for(let i=6;i<=1000;i++){ data.push({n:i, t:"भजन नंबर "+i+" जी", c:"भजन", icon:"🎵", video:"https://www.w3schools.com/html/mov_bbb.mp4", txt:"जय श्री राम जी..."}); }

let cur=0;
function load(i){ cur=i; let v=data[i]; document.getElementById('title').innerText=v.n+". "+v.t+" "+v.icon; document.getElementById('lyrics').innerText=v.txt; let vid=document.getElementById('fakeVideo'); if(v.video){ vid.src=v.video; vid.play(); } }
function next(){ if(cur < data.length-1) load(cur+1); }
function prev(){ if(cur>0) load(cur-1); }
let h=""; for(let i=0;i<data.length;i++){ h+=`<div class="item" onclick="load(${i})">${data[i].n}. ${data[i].t} ${data[i].icon}</div>`; } document.getElementById('list').innerHTML=h; load(0);
</script>
</body>
</html>
